<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="rhBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2D1115"/>
      <stop offset="70%" stop-color="#1E0C0E"/>
      <stop offset="100%" stop-color="#140608"/>
    </radialGradient>
    <linearGradient id="rhGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E5B4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9B7616"/>
    </linearGradient>
    <filter id="rhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#rhBg)" rx="24"/>

  <!-- Ornate Decorative Gold Borders -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#rhGold)" stroke-width="2.5" opacity="0.65"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="5 4" opacity="0.45"/>
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#rhGold)" stroke-width="1.5" opacity="0.85"/>

  <!-- Four Cardinal Accent Motifs -->
  <circle cx="250" cy="32" r="3" fill="#D4AF37"/>
  <circle cx="250" cy="468" r="3" fill="#D4AF37"/>
  <circle cx="32" cy="250" r="3" fill="#D4AF37"/>
  <circle cx="468" cy="250" r="3" fill="#D4AF37"/>

  <!-- Central Circular Seal for Jaapi -->
  <circle cx="250" cy="200" r="110" fill="#140608" stroke="url(#rhGold)" stroke-width="2"/>
  <circle cx="250" cy="200" r="102" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Traditional Jaapi Scaled & Centered (original 120x120 -> scaled by 1.45, centered at 250, 200) -->
  <g transform="translate(163, 113) scale(1.45)">
    <!-- Base Glow -->
    <!-- Conical Dome -->
    <path d="M60 18 L18 88 C18 88 38 98 60 98 C82 98 102 88 102 88 L60 18 Z" fill="#D4AF37" fill-opacity="0.18" stroke="#D4AF37" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Center Kalash Finial with Peacock Tuft -->
    <path d="M58 18 L60 8 L62 18 Z" fill="#F5E5B4"/>
    <circle cx="60" cy="7" r="3.2" fill="#F5E5B4"/>
    <path d="M60 4 C57 1 63 1 60 4" stroke="#F5E5B4" stroke-width="1.5"/>
    
    <!-- Traditional Crimson Red Cloth Patches (Phool) -->
    <path d="M60 38 L48 60 L72 60 Z" fill="#B31B1B" stroke="#D4AF37" stroke-width="0.8"/>
    <path d="M36 68 L24 86 L48 86 Z" fill="#B31B1B" stroke="#D4AF37" stroke-width="0.8"/>
    <path d="M84 68 L72 86 L96 86 Z" fill="#B31B1B" stroke="#D4AF37" stroke-width="0.8"/>
    <path d="M60 66 L48 88 L72 88 Z" fill="#B31B1B" stroke="#D4AF37" stroke-width="0.8"/>
    
    <!-- Bamboo Ribs -->
    <line x1="60" y1="18" x2="32" y2="92" stroke="#F5E5B4" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.85"/>
    <line x1="60" y1="18" x2="46" y2="96" stroke="#F5E5B4" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.85"/>
    <line x1="60" y1="18" x2="60" y2="98" stroke="#F5E5B4" stroke-width="1.4" opacity="0.9"/>
    <line x1="60" y1="18" x2="74" y2="96" stroke="#F5E5B4" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.85"/>
    <line x1="60" y1="18" x2="88" y2="92" stroke="#F5E5B4" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.85"/>
    
    <!-- Outer Rim Beads -->
    <circle cx="28" cy="90" r="2.8" fill="#F5E5B4"/>
    <circle cx="44" cy="95" r="2.8" fill="#F5E5B4"/>
    <circle cx="60" cy="97" r="3.4" fill="#F5E5B4"/>
    <circle cx="76" cy="95" r="2.8" fill="#F5E5B4"/>
    <circle cx="92" cy="90" r="2.8" fill="#F5E5B4"/>
  </g>

  <!-- Brand Typography -->
  <!-- Brand Name -->
  <text x="250" y="365" 
        font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
        font-size="34" 
        font-weight="700" 
        letter-spacing="5" 
        fill="url(#rhGold)" 
        text-anchor="middle">
    RINA HAZARIKA
  </text>

  <!-- Decorative Separator Line -->
  <line x1="160" y1="384" x2="220" y2="384" stroke="url(#rhGold)" stroke-width="1" opacity="0.6"/>
  <circle cx="250" cy="384" r="3" fill="#D4AF37"/>
  <line x1="280" y1="384" x2="340" y2="384" stroke="url(#rhGold)" stroke-width="1" opacity="0.6"/>

  <!-- Assamese Script Sub-label -->
  <text x="250" y="408" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="2" 
        fill="#F5E5B4" 
        text-anchor="middle"
        opacity="0.95">
    ৰীণা হাজৰিকা
  </text>

  <!-- Tagline / Discipline -->
  <text x="250" y="432" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="3.5" 
        fill="#D4AF37" 
        text-anchor="middle"
        opacity="0.85">
    AXOMIYA BASTRA &amp; ALONKAR
  </text>
</svg>

