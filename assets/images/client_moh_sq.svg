<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="mohDarkBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f1816"/>
      <stop offset="75%" stop-color="#120e0d"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </radialGradient>
    <linearGradient id="mohGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4b8"/>
      <stop offset="45%" stop-color="#e7c185"/>
      <stop offset="100%" stop-color="#765928"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#mohDarkBg)" rx="24"/>

  <!-- Ornate Hairline Borders -->
  <rect x="24" y="24" width="452" height="452" rx="16" fill="none" stroke="url(#mohGold)" stroke-width="1.5" opacity="0.45"/>
  <rect x="36" y="36" width="428" height="428" rx="12" fill="none" stroke="#e7c185" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.3"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#mohGold)" stroke-width="1" opacity="0.4"/>

  <!-- Corner Flourishes -->
  <circle cx="36" cy="36" r="3" fill="#e7c185"/>
  <circle cx="464" cy="36" r="3" fill="#e7c185"/>
  <circle cx="36" cy="464" r="3" fill="#e7c185"/>
  <circle cx="464" cy="464" r="3" fill="#e7c185"/>

  <!-- Center Top Atelier Diamond -->
  <polygon points="250,135 258,147 250,159 242,147" fill="url(#mohGold)"/>
  <circle cx="250" cy="147" r="1.5" fill="#120e0d"/>

  <!-- Main Wordmark: M · O · H -->
  <text x="250" y="245" 
        font-family="'Bodoni Moda', 'Playfair Display', 'Didot', 'Cinzel', 'Georgia', serif" 
        font-size="64" 
        font-weight="500" 
        letter-spacing="14" 
        fill="url(#mohGold)" 
        text-anchor="middle">
    M · O · H
  </text>

  <!-- Hairline Separator with Center Knot -->
  <line x1="140" y1="275" x2="225" y2="275" stroke="url(#mohGold)" stroke-width="0.8" opacity="0.5"/>
  <circle cx="250" cy="275" r="2.5" fill="#e7c185"/>
  <line x1="275" y1="275" x2="360" y2="275" stroke="url(#mohGold)" stroke-width="0.8" opacity="0.5"/>

  <!-- Subtitle: ATELIER · AHMEDABAD -->
  <text x="250" y="315" 
        font-family="'Hanken Grotesk', 'Plus Jakarta Sans', -apple-system, sans-serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="8" 
        fill="#e7c185" 
        text-anchor="middle"
        opacity="0.95">
    ATELIER · AHMEDABAD
  </text>

  <!-- Tagline / Heritage Line -->
  <text x="250" y="352" 
        font-family="'JetBrains Mono', monospace" 
        font-size="9.5" 
        font-weight="600" 
        letter-spacing="4" 
        fill="#a88d5e" 
        text-anchor="middle"
        opacity="0.85">
    HAUTE COUTURE &amp; HEIRLOOMS
  </text>
</svg>

