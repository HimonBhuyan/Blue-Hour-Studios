<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="tmBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a1219"/>
      <stop offset="75%" stop-color="#16080d"/>
      <stop offset="100%" stop-color="#0a0306"/>
    </radialGradient>
    <linearGradient id="tmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2d6"/>
      <stop offset="45%" stop-color="#e8be77"/>
      <stop offset="100%" stop-color="#9d7328"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#tmBg)" rx="24"/>

  <!-- Ornate Heritage Borders -->
  <rect x="24" y="24" width="452" height="452" rx="16" fill="none" stroke="url(#tmGold)" stroke-width="1.5" opacity="0.45"/>
  <rect x="36" y="36" width="428" height="428" rx="12" fill="none" stroke="#e8be77" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.3"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#tmGold)" stroke-width="1" opacity="0.3"/>

  <!-- Temple Gopuram / Heritage Emblem -->
  <g transform="translate(250, 155)">
    <!-- Heritage Star / Sunburst -->
    <polygon points="0,-42 12,-16 38,-26 22,-2 46,14 18,18 20,46 -2,26 -24,46 -20,18 -46,14 -22,-2 -38,-26 -12,-16" fill="none" stroke="url(#tmGold)" stroke-width="1.2" opacity="0.7"/>
    <!-- Temple Tier Silhouette -->
    <polygon points="0,-28 16,-6 10,-6 14,10 8,10 12,24 -12,24 -8,10 -14,10 -10,-6 -16,-6" fill="url(#tmGold)"/>
    <circle cx="0" cy="-33" r="3" fill="#ffe4b8"/>
  </g>

  <!-- Main Wordmark: T.M. HOTEL -->
  <text x="250" y="258" 
        font-family="'Space Grotesk', 'Playfair Display', serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="5" 
        fill="url(#tmGold)" 
        text-anchor="middle">
    T.M. HOTEL
  </text>

  <!-- Hairline Separator with Diamond -->
  <line x1="130" y1="285" x2="225" y2="285" stroke="url(#tmGold)" stroke-width="1" opacity="0.5"/>
  <polygon points="250,281 254,285 250,289 246,285" fill="#ffe4b8"/>
  <line x1="275" y1="285" x2="370" y2="285" stroke="url(#tmGold)" stroke-width="1" opacity="0.5"/>

  <!-- Subtitle: MADURAI · HERITAGE STAY -->
  <text x="250" y="320" 
        font-family="'JetBrains Mono', monospace" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="6" 
        fill="#f7d69e" 
        text-anchor="middle">
    MADURAI · HERITAGE STAY
  </text>

  <!-- Est. 1950 Heritage Pill -->
  <g transform="translate(250, 370)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="rgba(232, 190, 119, 0.08)" stroke="rgba(232, 190, 119, 0.3)" stroke-width="1"/>
    <text x="0" y="5" 
          font-family="'JetBrains Mono', monospace" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#ffe4b8" 
          text-anchor="middle">
      ESTABLISHED 1950
    </text>
  </g>
</svg>
