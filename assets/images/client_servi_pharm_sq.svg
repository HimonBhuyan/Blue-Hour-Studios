<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="spBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f213a"/>
      <stop offset="75%" stop-color="#081424"/>
      <stop offset="100%" stop-color="#040a12"/>
    </radialGradient>
    <linearGradient id="spCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="50%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#0575e6"/>
    </linearGradient>
    <linearGradient id="spWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbe3fb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#spBg)" rx="24"/>

  <!-- Precision Borders -->
  <rect x="24" y="24" width="452" height="452" rx="16" fill="none" stroke="url(#spCyan)" stroke-width="1.5" opacity="0.45"/>
  <rect x="36" y="36" width="428" height="428" rx="12" fill="none" stroke="#38ef7d" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.3"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#spCyan)" stroke-width="1" opacity="0.25"/>

  <!-- Medical Cross / Shield Emblem -->
  <g transform="translate(250, 160)">
    <!-- Glowing Outer Ring -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#spCyan)" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#38ef7d" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
    <!-- Medical Cross -->
    <rect x="-10" y="-30" width="20" height="60" rx="6" fill="url(#spCyan)"/>
    <rect x="-30" y="-10" width="60" height="20" rx="6" fill="url(#spCyan)"/>
    <!-- Center Core Spark -->
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Main Wordmark: SERVI PHARM -->
  <text x="250" y="265" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="38" 
        font-weight="800" 
        letter-spacing="4" 
        fill="url(#spWhite)" 
        text-anchor="middle">
    SERVI PHARM
  </text>

  <!-- Hairline Separator -->
  <line x1="140" y1="290" x2="225" y2="290" stroke="url(#spCyan)" stroke-width="1.2" opacity="0.6"/>
  <circle cx="250" cy="290" r="3" fill="#38ef7d"/>
  <line x1="275" y1="290" x2="360" y2="290" stroke="url(#spCyan)" stroke-width="1.2" opacity="0.6"/>

  <!-- Subtitle: HEALTHCARE PVT. LTD. -->
  <text x="250" y="325" 
        font-family="'JetBrains Mono', monospace" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#38ef7d" 
        text-anchor="middle">
    HEALTHCARE PVT. LTD.
  </text>

  <!-- Bottom Location Pill -->
  <g transform="translate(250, 375)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="rgba(56, 239, 125, 0.08)" stroke="rgba(56, 239, 125, 0.25)" stroke-width="1"/>
    <text x="0" y="5" 
          font-family="'JetBrains Mono', monospace" 
          font-size="11" 
          font-weight="500" 
          letter-spacing="2.5" 
          fill="#cbe3fb" 
          text-anchor="middle">
      MUMBAI · ROC II
    </text>
  </g>
</svg>
