<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <!-- HB Monogram Gradient -->
    <linearGradient id="hbGradient" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Radial Ambient Backlight -->
    <radialGradient id="backlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow / Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Theme Adaptability -->
  <style>
    .fav-bg {
      fill: url(#bgGrad);
      stroke: url(#borderGrad);
    }
    @media (prefers-color-scheme: light) {
      .fav-bg {
        fill: #090d16;
        stroke: #0284c7;
        stroke-width: 2.2px;
      }
    }
  </style>

  <!-- Outer Rounded Squircle -->
  <rect class="fav-bg" x="2" y="2" width="60" height="60" rx="15" stroke-width="1.8"/>

  <!-- Subtle Radial Glow Behind Monogram -->
  <circle cx="32" cy="32" r="22" fill="url(#backlight)"/>

  <!-- Monogram & Tech Glyphs -->
  <g filter="url(#neonGlow)">
    <!-- H Left Stem -->
    <path d="M 17 16 L 17 48" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round"/>

    <!-- H Crossbar (Connecting with dynamic tech bridge) -->
    <path d="M 17 32 L 31 32" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Shared Central Spine (H right stem & B vertical spine) -->
    <path d="M 31 16 L 31 48" stroke="url(#hbGradient)" stroke-width="5.5" stroke-linecap="round"/>

    <!-- B Upper Bowl -->
    <path d="M 31 16 L 41 16 C 47.5 16 47.5 32 41 32 L 31 32" stroke="url(#hbGradient)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- B Lower Bowl -->
    <path d="M 31 32 L 43 32 C 49.5 32 49.5 48 43 48 L 31 48" stroke="#c084fc" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- AI Sparkle / Tech Accent (Diamond Star) -->
    <path d="M 49 12 C 49 14 50 15 52 15 C 50 15 49 16 49 18 C 49 16 48 15 46 15 C 48 15 49 14 49 12 Z" fill="#38bdf8"/>
  </g>
</svg>
